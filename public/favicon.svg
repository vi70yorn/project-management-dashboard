<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pmBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pmAccent" x1="35" y1="40" x2="53" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#pmBg)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="#93C5FD" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Left Column - Card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="11" y="13" width="18" height="15" rx="3.5" fill="#FFFFFF"/>
    <rect x="14" y="17" width="12" height="2.5" rx="1.25" fill="#2563EB"/>
    <rect x="14" y="22" width="8" height="2" rx="1" fill="#93C5FD"/>
  </g>

  <!-- Left Column - Card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="11" y="32" width="18" height="19" rx="3.5" fill="#FFFFFF"/>
    <rect x="14" y="36" width="12" height="2.5" rx="1.25" fill="#3B82F6"/>
    <rect x="14" y="41" width="9" height="2" rx="1" fill="#94A3B8"/>
    <rect x="14" y="45.5" width="6" height="2" rx="1" fill="#CBD5E1"/>
  </g>

  <!-- Right Column - Card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="13" width="18" height="22" rx="3.5" fill="#FFFFFF"/>
    <rect x="38" y="17" width="12" height="2.5" rx="1.25" fill="#1D4ED8"/>
    <rect x="38" y="22.5" width="9" height="2" rx="1" fill="#60A5FA"/>
    <rect x="38" y="27.5" width="7" height="2" rx="1" fill="#CBD5E1"/>
  </g>

  <!-- Right Column - Card 2 (Completed Status Badge) -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="39" width="18" height="12" rx="3.5" fill="url(#pmAccent)"/>
    <path d="M40.5 45L43 47.5L47.5 42.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

