<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UX UI Management</title>
    <meta name="description" content="Clean, focused project and task management dashboard with custom team member management, workload tracking, and Kanban boards." />
    <meta property="og:title" content="Project Management Dashboard" />
    <meta property="og:description" content="Clean, focused project and task management dashboard with custom team member management, workload tracking, and Kanban boards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&family=Google+Sans+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Sans+Khmer:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oldenburg&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,100..1000&family=Google+Sans+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Sans+Khmer:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var savedStyle = localStorage.getItem('ui_style');
          if (savedStyle === 'nothing') {
            document.documentElement.classList.add('ui-nothing');
            document.documentElement.setAttribute('data-ui-style', 'nothing');
          } else if (savedStyle === 'glass') {
            document.documentElement.classList.add('ui-glass');
            document.documentElement.setAttribute('data-ui-style', 'glass');
          } else {
            document.documentElement.classList.add('ui-normal');
            document.documentElement.setAttribute('data-ui-style', 'normal');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
